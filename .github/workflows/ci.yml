name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile contracts
        run: npm run compile
      - name: Contract tests
        run: npm test
      - name: Build front-end
        run: npm run build
        env:
          CI: true
